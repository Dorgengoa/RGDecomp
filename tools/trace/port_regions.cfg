# SPDX-License-Identifier: CC0-1.0
# Port-side annotations for the trace regions (docs/TRACE-PORT.md).
# Read by the port recorder (ptrs, ps2ptr) and by port_trace.py compare
# (exclude, pending).  The PCSX2 harness ignores this file.
#
#   ptrs     <region> <off>[,<off>...]  32-bit HOST pointer slots in the region's
#                                       bytes; the recorder writes the PS2 address
#                                       they map to (address map) before hashing
#   ps2ptr   <region>                   the region's stored pointer(s) are PS2
#                                       address VALUES (raw numbers the port kept),
#                                       not host pointers: no translation
#   exclude  <regex> <reason>           never comparable PCSX2 vs port: always ignored
#   pending  <regex> <reason>           not comparable YET (host-only bytes inside,
#                                       layout unaudited): ignored unless --strict
#
# The default compare is `--key vbl --only '^sym:' --ignore <exclude|pending>`.

# ---- pointer slots: known pointer fields (symbols.spec evidence) --------------------
ptrs  sym:GameMgrPtr      0
ptrs  sym:GameDataPtr     0          # -> static GameData D_004B8B30: exact through the symbol table
ptrs  sym:PartyPtr        0          # heap object: exact only if the heap layout matches retail
ptrs  sym:CharaListHost   0
ptrs  sym:EventScenePtr   0
ptrs  sym:GameData        0x14,0x18  # CharaMgr, party
ptrs  sym:ActionMgr       0x20       # CActionChara list
ptrs  sym:HeapA           0x18       # mgCMemory block list
ptrs  sym:HeapB           0x18
ptrs  sym:HeapNpcData     0x18
ptrs  sym:GameScene       0          # vtable D_00471210

# ---- never comparable -------------------------------------------------------------
exclude ^(ram|ram4m)@          coarse RAM chunks: MAIN statics live in host objects, code bytes are absent, stacks are host fibers
exclude ^(iop|spr)$            IOP RAM is HLE (no IOP code runs), the scratchpad is not EE address space on the port
exclude ^overlay$              the arena's text range is zeros on the port (OVERLAY.md open issue 7), and the range runs into the heap
exclude ^(vbl|pad0)$           duplicates of sym:VblankCount / sym:Pad0
exclude ^sym:VblankWaitFlag$   timing: set only while the main thread waits in WaitVsyncCount; the port's guest code costs no virtual time, so it never lags a frame

# ---- not comparable until audited ----------------------------------------------------
# Structs whose bytes include host-only values: vtables, function pointers,
# heap pointers, host-library buffers.  Declare their pointer slots above (and
# confirm heap parity), then move them out of this list.
pending ^sym:(GameMgrPtr|PartyPtr|CharaListHost|EventScenePtr)$  heap/host pointers: equal only if the heap layout matches retail
pending ^sym:Party$                      deref of a heap object; pointer fields inside unaudited
pending ^sym:GameScene$                  C++ object: vtable + camera stack pointers; slots unaudited
pending ^sym:Camera[0-5]$                C++ camera objects: vtables/pointers unaudited
pending ^sym:TaskTable$                  task entries hold name and function pointers
pending ^sym:(GameData|ActionMgr|EventContext|SystemVm|MenuStateMachine)$  pointer fields beyond the known slots unaudited
pending ^sym:(HeapA|HeapB|HeapNpcData)$  mgCMemory objects: vtable + block pointers; heap parity unconfirmed
pending ^sym:(Pad0|Pad1)$                pad objects hold libpad DMA-buffer pointers and padman-written bytes
