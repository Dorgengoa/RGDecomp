; SPDX-License-Identifier: CC0-1.0
; Template for the isolated portable PCSX2 used by tools/trace (written to
; .tools/pcsx2/inis/PCSX2.ini by `emu.py setup` and before every run).
; @BIOS_DIR@, @BIOS_FILE@, @PINE_SLOT@, @SPEED@ are filled in by emu.py.
; Every setting here exists for determinism or isolation; see README.md.

[UI]
SettingsVersion = 1
SetupWizardIncomplete = false
ConfirmShutdown = false
StartPaused = false
PauseOnFocusLoss = false
StartFullscreen = false
HideMainWindowWhenRunning = false
InhibitScreensaver = false

[Folders]
Bios = @BIOS_DIR@

[Filenames]
BIOS = @BIOS_FILE@

[AutoUpdater]
CheckAtStartup = false

[EmuCore]
EnablePINE = true
PINESlot = @PINE_SLOT@
EnableFastBoot = true
EnableFastBootFastForward = false
; GameDB code patches rewrite retail EE code (SCUS-97490 has one at 0x124898);
; the port runs the unpatched code, so the reference must too.
EnablePatches = false
EnableCheats = false
EnableWideScreenPatches = false
EnableNoInterlacingPatches = false
EnableGameFixes = true
EnableRecordingTools = true
EnableDiscordPresence = false
SaveStateOnShutdown = false
BackupSavestate = false
UseSavestateSelector = false
; ratio 0 = uncompressed: snapshot zips are read back every sample.
SavestateCompressionType = 0
SavestateCompressionRatio = 0
; Fixed RTC: the game can read the clock through CDVD.
ManuallySetRealTimeClock = true
RtcYear = 26
RtcMonth = 1
RtcDay = 1
RtcHour = 12
RtcMinute = 0
RtcSecond = 0
HostFs = false
CdvdPrecache = false

[EmuCore/Speedhacks]
EECycleRate = 0
EECycleSkip = 0
fastCDVD = false
IntcStat = true
WaitLoop = true
vuFlagHack = true
; MTVU runs VU1 on its own host thread: off for determinism.
vuThread = false
vu1Instant = true

[EmuCore/GS]
; 11 = Null renderer (no GPU dependence, fastest).
Renderer = @RENDERER@
VsyncEnable = false

[Achievements]
Enabled = false

[Framerate]
NominalScalar = @SPEED@

[MemoryCards]
Slot1_Enable = false
Slot2_Enable = false

[Logging]
EnableSystemConsole = false
EnableFileLogging = true
EnableTimestamps = false
EnableVerbose = false
EnableEEConsole = true
EnableIOPConsole = false

; No host input source at all: a physical pad or a stray keypress must never
; leak into a reference run. Scripted input goes through input.py instead.
[InputSources]
Keyboard = false
Mouse = false
SDL = false
DInput = false
XInput = false

[Pad1]
Type = DualShock2

[Pad2]
Type = None

[GameList]
RecursivePaths =
