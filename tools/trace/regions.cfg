# Regions hashed every sample by trace.py.
#   space  name       start       end         [chunk]
# space: ee (EE main RAM, 32 MB), iop (IOP RAM, 2 MB), spr (EE scratchpad, 16 KB;
#        addresses are offsets 0..0x4000).
# With a chunk size the range is split and each piece is named name@<start>.
# Coarse catch-all regions plus every named symbol (regions_symbols.cfg,
# generated from symbols.spec by gen_regions.py).

ee   ram       0x00100000  0x02000000  0x00100000
ee   overlay   0x004E9E80  0x00600000
ee   vbl       0x004810C4  0x004810C8
ee   pad0      0x004B2570  0x004B2590
spr  spr       0x00000000  0x00004000
iop  iop       0x00000000  0x00200000

include regions_symbols.cfg
