# Synthetic trace regions for rg-runtime-demo (src/trace/demo/trace_demo_syms.h):
# the demo guest's globals at made-up PS2 addresses, so the pipeline runs
# before the game links (docs/TRACE-PORT.md "Demo").
ee  sym:VblankCount      0x004810C4  0x004810C8    # fields_done: the demo's game counter
ee  sym:DemoPadWords     0x00500000  0x00502000    # pad_word[4096]: input-dependent
ee  sym:DemoPadReads     0x00502000  0x00502004
ee  sym:DemoGfxFrames    0x00502004  0x00502008
ee  sym:DemoPadStable    0x00502008  0x0050200C
ee  sym:DemoPtrs         0x00502100  0x0050210C    # 3 host pointers, translated (demo_port.cfg)
ee  sym:DemoPadReadsVia  *0x00502100      4        # host-pointer deref -> pad_reads
ee  sym:DemoHeap         *0x00502104      0x40     # deref into the crt0 RAM block (heap)
ee  sym:DemoNull         *0x00502108      4        # null -> "ptr:00000000"
ee  sym:DemoHeapDirect   0x00528200  0x00528240    # the same heap bytes by address
ee  sym:DemoUnmapped     0x00100000  0x00100010    # MAIN text: no port equivalent ('# unmapped')
iop iop                  0x00000000  0x00200000    # IOP RAM: no port equivalent
