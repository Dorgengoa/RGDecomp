# Region semantics cross-check (trace.image_xcheck): every construct of the
# trace.py grammar, over a synthetic EE image.  Same file, both parsers.
include xcheck_include.cfg
ee   ram       0x00100000  0x00400000  0x00100000
ee   odd       0x00000010  0x00000035  0x10          # last chunk shorter
ee   dec       1_048_576   1048600
ee   empty     0x00200000  0x00200000                 # zero bytes
ee   big       0x01FFFF00  0x02000100                 # clipped at the end of RAM
ee   sym:Rand  *0x00449858+0xA8   8                   # valid pointer + offset
ee   sym:Null  *0x00483820        4                   # null pointer -> marker
ee   sym:Past  *0x00483824        0x20                # runs past RAM -> marker
ee   sym:Kseg  *0x00483828+0x10   16                  # kseg0 pointer, masked
ee   sym:End   *0x0048382C        0x100               # ends exactly at 32 MB
iop  iop       0x00000000  0x00200000                 # no port equivalent: skipped by both
spr  spr       0x00000000  0x00004000
